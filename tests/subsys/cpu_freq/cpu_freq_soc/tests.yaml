common:
  tags: cpu_freq

tests:
  # Use the SoC version of cpu_freq_pstate_set()
  subsys.cpu_freq.soc:
    platform_allow:
      - native_sim
      - native_sim/native/64
      - frdm_mcxn236
      - frdm_imx93/mimx9352/a55/smp
      - frdm_imx91/mimx9131
    integration_platforms:
      - native_sim
      - native_sim/native/64

  subsys.cpu_freq.soc.stm32n6:
    extra_dtc_overlay_files:
      - pstate-stm32n6.overlay
    platform_allow:
      - nucleo_n657x0_q/stm32n657xx/sb
      - stm32n6570_dk/stm32n657xx/sb
    integration_platforms:
      - nucleo_n657x0_q/stm32n657xx/sb
      - stm32n6570_dk/stm32n657xx/sb
    extra_configs:
      - CONFIG_CORTEX_M_SYSTICK=n
      - CONFIG_STM32_LPTIM_TIMER=y
      - CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=32768
      - CONFIG_SYS_CLOCK_TICKS_PER_SEC=4096
      - CONFIG_PM=n
      - CONFIG_CPU_FREQ_POLICY_ON_DEMAND=n
      - CONFIG_CPU_FREQ_POLICY_PRESSURE=y
      - CONFIG_CPU_FREQ_PSTATE_SET_SOC=y

  # Use the stub version of cpu_freq_pstate_set()
  subsys.cpu_freq.stub:
    extra_dtc_overlay_files:
      - pstate-stub.overlay
    platform_allow:
      - qemu_cortex_a53/qemu_cortex_a53/smp
    integration_platforms:
      - qemu_cortex_a53/qemu_cortex_a53/smp
    extra_configs:
      - CONFIG_CPU_FREQ_PSTATE_SET_STUB=y
