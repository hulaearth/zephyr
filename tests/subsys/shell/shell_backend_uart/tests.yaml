tests:
  shell.backend.uart:
    min_flash: 64
    min_ram: 32
    tags:
      - shell
      - backend
      - uart
    platform_allow:
      - qemu_x86
      - qemu_riscv32
  shell.backend.uart.silent_start:
    min_flash: 64
    min_ram: 32
    tags:
      - shell
      - backend
      - uart
    extra_configs:
      - CONFIG_SHELL_STARTUP_OUTPUT=n
    platform_allow:
      - native_sim/native/64
